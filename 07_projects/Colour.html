<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        .button {
            display: inline-block;
            width: 100px;
            height: 100px;
            border: 2px solid black;
            margin: 10px;
            cursor: pointer;
        }

        #grey {
            background-color: grey;
        }

        #black {
            background-color: black;
        }

        #blue {
            background-color: blue;
        }

        #yellow {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Colour Switcher</h1>

    <span id="grey" class="button">GREY</span>
    <span id="black" class="button">BLACK</span>
    <span id="blue" class="button">BLUE</span>
    <span id="yellow" class="button">YELLOW</span>

    <h2> click on any colour to change the background</h2>

</body>
<script>
    const button = document.querySelectorAll('.button');
    const body = document.querySelector('body')

    button.forEach(function (button){
        button.addEventListener('click', function(e){
            if(e.target.id == 'grey'){
                body.style.backgroundColor = e.target.id;

            }
            if(e.target.id == 'black'){
                body.style.backgroundColor = e.target.id;
                
            }
            if(e.target.id == 'blue'){
                body.style.backgroundColor = e.target.id;
                
            }
            if(e.target.id == 'yellow'){
                body.style.backgroundColor = e.target.id;
                
            }
        })
    })
</script>
</html>
